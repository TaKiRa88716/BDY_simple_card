<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排球員身分證預覽 | Volleyball Player ID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #f0f4f8;
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #141923;
            border: 1px solid #232d3f;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .header {
            margin-bottom: 1rem;
        }
        .header h1 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.85rem;
            color: #8a99ad;
        }
        .card-preview-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 79.7 / 48;
            margin: 1.2rem 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,107,0,0.4);
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 1rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #ff6b00, #e65100);
            box-shadow: 0 4px 15px rgba(255,107,0,0.4);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-outline {
            background: transparent;
            color: #8a99ad;
            border: 1px solid #232d3f;
            box-shadow: none;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #5c6b7e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏐 排球員身分證</h1>
            <p>實體規格：79.7 mm × 48 mm (300 DPI)</p>
        </div>

        <div class="card-preview-wrapper">
            <img src="{{ card_img_url }}" alt="排球員身分證" class="card-img">
        </div>

        <div class="actions">
            <a href="{{ card_img_url }}" download="Volleyball_ID_Card.png" class="btn">
                <span>💾 下載圖檔至手機/電腦</span>
            </a>
            <a href="/" class="btn btn-outline">
                <span>🏠 前往製作身分證</span>
            </a>
        </div>

        <div class="footer">
            <p>Volleyball Player ID Card Studio &copy; 2026</p>
        </div>
    </div>
</body>
</html>
